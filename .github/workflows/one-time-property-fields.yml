name: Add property information fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin and public property card
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python <<'PY'
          from pathlib import Path

          admin = Path('brea88/src/app/admin/dashboard/page.tsx')
          text = admin.read_text(encoding='utf-8-sig')

          text = text.replace(
              "  sqft?: number | null;\n  createdAt?: string | null;",
              "  sqft?: number | null;\n  developer?: string | null;\n  bankFinancing?: string[] | null;\n  description?: string | null;\n  videoUrl?: string | null;\n  totalcp?: string | null;\n  createdAt?: string | null;",
              1,
          )

          text = text.replace(
              "  sqft: string;\n}\n\nconst INITIAL_FORM",
              "  sqft: string;\n  developer: string;\n  bankFinancing: string[];\n  newBankFinancing: string;\n  description: string;\n  videoUrl: string;\n  totalcp: string;\n}\n\nconst BANK_FINANCING_OPTIONS = [\n  'BDO',\n  'China Bank',\n  'Metrobank',\n  'Pag-IBIG',\n  'Other / Add New',\n];\n\nconst INITIAL_FORM",
              1,
          )

          text = text.replace(
              "  sqft: '',\n};",
              "  sqft: '',\n  developer: '',\n  bankFinancing: [],\n  newBankFinancing: '',\n  description: '',\n  videoUrl: '',\n  totalcp: '',\n};",
              1,
          )

          text = text.replace(
              "  function resetForm() {",
              "  function addBankFinancing(value: string) {\n    const trimmed = value.trim();\n    if (!trimmed) return;\n    setFormData((current) => ({\n      ...current,\n      bankFinancing: current.bankFinancing.includes(trimmed)\n        ? current.bankFinancing\n        : [...current.bankFinancing, trimmed],\n      newBankFinancing: '',\n    }));\n  }\n\n  function removeBankFinancing(value: string) {\n    setFormData((current) => ({\n      ...current,\n      bankFinancing: current.bankFinancing.filter((item) => item !== value),\n    }));\n  }\n\n  function resetForm() {",
              1,
          )

          text = text.replace(
              "      sqft:\n        property.sqft !== null &&\n        property.sqft !== undefined\n          ? String(property.sqft)\n          : '',\n    });",
              "      sqft:\n        property.sqft !== null &&\n        property.sqft !== undefined\n          ? String(property.sqft)\n          : '',\n      developer: property.developer || '',\n      bankFinancing: property.bankFinancing || [],\n      newBankFinancing: '',\n      description: property.description || '',\n      videoUrl: property.videoUrl || '',\n      totalcp: property.totalcp || '',\n    });",
              1,
          )

          text = text.replace(
              "            sqft: formData.sqft\n              ? Number(formData.sqft)\n              : null,\n\n            image: uploadedImageUrls[0],",
              "            sqft: formData.sqft\n              ? Number(formData.sqft)\n              : null,\n\n            developer: formData.developer.trim() || null,\n            bankFinancing: formData.bankFinancing,\n            description: formData.description.trim() || null,\n            videoUrl: formData.videoUrl.trim() || null,\n            totalcp: formData.totalcp.trim() || null,\n\n            image: uploadedImageUrls[0],",
              1,
          )

          marker = "                {/* Images */}"
          section = r'''                {/* Developer & Buyer Information */}
                <div className="overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm">
                  <div className="border-b border-slate-100 px-5 py-5 sm:px-6">
                    <div className="flex items-center gap-3">
                      <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-50 text-violet-600">
                        <Building2 size={19} />
                      </div>
                      <div>
                        <h3 className="font-bold text-slate-900">Developer & Buyer Information</h3>
                        <p className="mt-1 text-xs text-slate-500">Add developer, financing, full details, and an optional property video.</p>
                      </div>
                    </div>
                  </div>

                  <div className="grid gap-5 p-5 sm:p-6">
                    <div className="grid gap-5 lg:grid-cols-2">
                      <div className="space-y-2">
                        <label htmlFor="developer" className="text-sm font-semibold text-slate-700">Developer</label>
                        <input id="developer" name="developer" value={formData.developer} onChange={handleInputChange} placeholder="e.g. Cebu Landmasters, Inc." className="h-12 w-full rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
                        <p className="text-xs text-slate-400">Type the developer name. You can enter a new developer anytime.</p>
                      </div>

                      <div className="space-y-2">
                        <label htmlFor="bankFinancing" className="text-sm font-semibold text-slate-700">Bank Financing</label>
                        <div className="relative">
                          <select id="bankFinancing" value="" onChange={(event) => { if (event.target.value !== 'Other / Add New') addBankFinancing(event.target.value); }} className="h-12 w-full appearance-none rounded-xl border border-slate-200 bg-white px-4 pr-10 text-sm font-medium text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10">
                            <option value="">Select bank financing</option>
                            {BANK_FINANCING_OPTIONS.map((option) => <option key={option} value={option}>{option}</option>)}
                          </select>
                          <ChevronDown size={17} className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" />
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {formData.bankFinancing.map((bank) => (
                            <span key={bank} className="inline-flex items-center gap-2 rounded-full bg-blue-50 px-3 py-1.5 text-xs font-bold text-blue-700">
                              {bank}
                              <button type="button" onClick={() => removeBankFinancing(bank)} className="text-blue-400 hover:text-blue-700" aria-label={`Remove ${bank}`}>×</button>
                            </span>
                          ))}
                        </div>
                        <div className="flex gap-2">
                          <input value={formData.newBankFinancing} onChange={(event) => setFormData((current) => ({ ...current, newBankFinancing: event.target.value }))} onKeyDown={(event) => { if (event.key === 'Enter') { event.preventDefault(); addBankFinancing(formData.newBankFinancing); } }} placeholder="Add another bank / financing provider" className="h-11 flex-1 rounded-xl border border-slate-200 bg-white px-4 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
                          <button type="button" onClick={() => addBankFinancing(formData.newBankFinancing)} className="rounded-xl bg-slate-900 px-4 text-xs font-bold text-white transition hover:bg-blue-700">Add</button>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-2">
                      <label htmlFor="totalcp" className="text-sm font-semibold text-slate-700">Total Contract Price</label>
                      <input id="totalcp" name="totalcp" value={formData.totalcp} onChange={handleInputChange} placeholder="Optional total contract price" className="h-12 w-full rounded-xl border border-slate-200 bg-white px-4 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
                    </div>

                    <div className="space-y-2">
                      <label htmlFor="description" className="text-sm font-semibold text-slate-700">Property Details</label>
                      <textarea id="description" name="description" value={formData.description} onChange={handleInputChange} rows={7} placeholder="Enter the complete property details, inclusions, features, amenities, payment terms, and other information provided by the developer..." className="w-full resize-y rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm leading-6 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
                    </div>

                    <div className="space-y-2">
                      <label htmlFor="videoUrl" className="text-sm font-semibold text-slate-700">Property Video</label>
                      <div className="relative">
                        <LinkIcon size={17} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input id="videoUrl" name="videoUrl" type="url" value={formData.videoUrl} onChange={handleInputChange} placeholder="https://www.youtube.com/watch?v=..." className="h-12 w-full rounded-xl border border-slate-200 bg-white pl-11 pr-4 text-sm font-medium text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
                      </div>
                      <p className="text-xs text-slate-400">Optional. Add the developer's YouTube, Vimeo, or direct video URL. The public card will show a View Video button only when this is provided.</p>
                    </div>
                  </div>
                </div>

'''
          if marker not in text:
              raise SystemExit('Admin insertion marker not found')
          text = text.replace(marker, section + marker, 1)

          admin.write_text(text, encoding='utf-8')

          card = Path('brea88/src/app/propertyCard.tsx')
          text = card.read_text(encoding='utf-8-sig')
          text = text.replace(
              "  description?: string;\n}",
              "  description?: string;\n  bankFinancing?: string[];\n  videoUrl?: string | null;\n}",
              1,
          )
          text = text.replace(
              "  const [showGallery, setShowGallery] = useState(false);",
              "  const [showGallery, setShowGallery] = useState(false);\n  const [showVideo, setShowVideo] = useState(false);",
              1,
          )
          card_buttons = r'''          <div className="mt-5 grid grid-cols-2 gap-2">
            {property.videoUrl && (
              <button type="button" onClick={(event) => { event.stopPropagation(); setShowVideo(true); }} className="flex items-center justify-center gap-2 rounded-xl bg-[#071936] px-4 py-3 text-xs font-bold text-white shadow-lg transition hover:-translate-y-0.5 hover:bg-[#0d2852] active:scale-[0.98]">
                ▶ View Video
              </button>
            )}
            <button type="button" onClick={(event) => { event.stopPropagation(); openDetails(); }} className={`${property.videoUrl ? '' : 'col-span-2'} flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-xs font-bold text-slate-800 shadow-sm transition hover:-translate-y-0.5 hover:border-[#c9a96e] hover:text-[#071936] active:scale-[0.98]`}>
              More Details
            </button>
          </div>
'''
          marker = "        </div>\n      </article>"
          if marker not in text:
              raise SystemExit('Property card insertion marker not found')
          text = text.replace(marker, "        </div>\n" + card_buttons + "      </article>", 1)
          marker = "            {property.description && <div className=\"mt-8\"><h3 className=\"text-lg font-black text-slate-950\">Property Description</h3><p className=\"mt-3 max-w-3xl text-sm leading-7 text-slate-600 sm:text-base\">{property.description}</p></div>}"
          replacement = marker + "\n            {property.bankFinancing?.length ? <div className=\"mt-6\"><h3 className=\"text-lg font-black text-slate-950\">Bank Financing</h3><div className=\"mt-3 flex flex-wrap gap-2\">{property.bankFinancing.map((bank) => <span key={bank} className=\"rounded-full bg-blue-50 px-3 py-1.5 text-xs font-bold text-blue-700\">{bank}</span>)}</div></div> : null}"
          if marker in text:
              text = text.replace(marker, replacement, 1)
          video_modal = r'''
      {showVideo && property.videoUrl && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/85 p-3 backdrop-blur-md" onClick={() => setShowVideo(false)}>
          <div onClick={(event) => event.stopPropagation()} className="relative w-full max-w-5xl overflow-hidden rounded-[1.5rem] bg-black shadow-2xl">
            <button type="button" onClick={() => setShowVideo(false)} aria-label="Close video" className="absolute right-4 top-4 z-10 flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-black/60 text-white backdrop-blur-md transition hover:bg-[#c9a96e]"><X className="h-5 w-5" /></button>
            <div className="aspect-video w-full bg-black">
              <iframe src={property.videoUrl} title={`${property.title} video`} className="h-full w-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen />
            </div>
          </div>
        </div>
      )}
'''
          marker = "      {showDetails && <div className="
          if marker not in text:
              raise SystemExit('Video modal marker not found')
          text = text.replace(marker, video_modal + "\n" + marker, 1)
          card.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brea88/src/app/admin/dashboard/page.tsx brea88/src/app/propertyCard.tsx
          git rm .github/workflows/one-time-property-fields.yml
          git commit -m "Add developer financing details and property video UI [skip ci]"
          git push
